name: Python projects
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r projects/09-qr-code-studio/requirements.txt -r projects/11-expense-tracker/requirements.txt
      - run: python scripts/run_project_tests.py
